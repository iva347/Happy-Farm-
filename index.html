<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Веселая Ферма - Telegram Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        .playful-font { font-family: 'Fredoka', cursive; }
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-gentle { animation: bounce-gentle 2s infinite ease-in-out; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto bg-gradient-to-b from-amber-900 via-stone-900 to-slate-900 shadow-2xl relative overflow-hidden">

    <header class="bg-stone-900/90 backdrop-blur-md px-4 py-3 border-b border-amber-700/40 flex justify-between items-center z-20">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-full bg-amber-500 flex items-center justify-center text-slate-900 font-bold shadow-inner text-lg">
                <i class="fa-solid fa-cow"></i>
            </div>
            <div>
                <h1 class="playful-font text-amber-300 font-bold text-lg leading-tight">Веселая Ферма</h1>
                <p class="text-xs text-slate-400">Уровень <span id="level-display">1</span></p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div class="bg-stone-800 border border-amber-500/50 px-3 py-1 rounded-full flex items-center space-x-1.5 shadow-md">
                <span class="text-amber-400 text-sm"><i class="fa-solid fa-coins"></i></span>
                <span id="coins-display" class="playful-font font-bold text-amber-200 text-sm">350</span>
            </div>
            <div class="bg-stone-800 border border-sky-500/50 px-3 py-1 rounded-full flex items-center space-x-1.5 shadow-md">
                <span class="text-sky-400 text-sm"><i class="fa-solid fa-droplet"></i></span>
                <span id="water-display" class="playful-font font-bold text-sky-200 text-sm">10/10</span>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto relative pb-20 p-4 space-y-4">
        <!-- ФЕРМА -->
        <section id="tab-farm" class="space-y-4 tab-content">
            <div class="bg-gradient-to-r from-emerald-800 to-green-700 rounded-2xl p-4 shadow-lg border border-emerald-500/30">
                <h2 class="playful-font text-xl font-bold text-emerald-100 mb-1">Деревенский дворик</h2>
                <p class="text-xs text-emerald-200 mb-3">Сажайте зерно на грядках и собирайте продукцию с животных!</p>
                <button onclick="waterAllCrops()" class="bg-sky-500 hover:bg-sky-600 text-white text-xs font-semibold px-3 py-1.5 rounded-xl shadow transition">
                    <i class="fa-solid fa-cloud-rain"></i> Полить всё (2 воды)
                </button>
            </div>

            <!-- Полянка с животными -->
            <div class="bg-gradient-to-b from-emerald-600 via-green-700 to-emerald-900 rounded-3xl p-3 border-2 border-emerald-400/50 shadow-xl">
                <h3 class="playful-font font-bold text-xs text-emerald-100 mb-2">Зеленая полянка (Тапайте для сбора)</h3>
                <div id="pasture-animals-container" class="relative w-full h-48 rounded-2xl overflow-hidden bg-emerald-950/40 border border-emerald-500/30 flex items-center justify-around">
                    <!-- Рендерится через JS -->
                </div>
            </div>

            <!-- Грядки -->
            <div>
                <h3 class="playful-font font-semibold text-sm text-amber-200 mb-2">Грядки пшеницы</h3>
                <div id="crops-grid" class="grid grid-cols-3 gap-3"></div>
            </div>

            <!-- Список животных -->
            <div>
                <h3 class="playful-font font-semibold text-sm text-amber-200 mb-2">Питомцы на ферме</h3>
                <div id="animals-grid" class="grid grid-cols-2 gap-3"></div>
            </div>
        </section>

        <!-- СКЛАД -->
        <section id="tab-warehouse" class="space-y-4 tab-content hidden">
            <div class="bg-gradient-to-r from-slate-800 to-indigo-900 rounded-2xl p-4 shadow-lg border border-indigo-500/30 flex justify-between items-center">
                <div>
                    <h2 class="playful-font text-xl font-bold text-indigo-100">Склад фермы</h2>
                    <p class="text-xs text-indigo-200">Собранные ресурсы</p>
                </div>
                <button onclick="sellAllGoods()" class="bg-amber-500 text-stone-900 font-bold px-3 py-2 rounded-xl text-xs shadow">Продать всё</button>
            </div>
            <div id="inventory-grid" class="grid grid-cols-3 gap-3"></div>
        </section>

        <!-- МАГАЗИН -->
        <section id="tab-shop" class="space-y-4 tab-content hidden">
            <h2 class="playful-font text-xl font-bold text-purple-100">Лавка фермера</h2>
            <div id="shop-list" class="space-y-3"></div>
        </section>
    </main>

    <!-- Уведомления -->
    <div id="toast-container" class="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center space-y-2 w-full max-w-xs"></div>

    <!-- Нижнее меню -->
    <nav class="absolute bottom-0 left-0 right-0 bg-stone-900/95 backdrop-blur-md border-t border-amber-700/40 px-1 py-2 flex justify-around items-center z-30">
        <button onclick="switchTab('farm')" id="nav-btn-farm" class="flex flex-col items-center space-y-1 text-amber-400 nav-btn px-3 py-1">
            <i class="fa-solid fa-wheat-awn text-base"></i><span class="text-[9px] playful-font font-semibold">Ферма</span>
        </button>
        <button onclick="switchTab('warehouse')" id="nav-btn-warehouse" class="flex flex-col items-center space-y-1 text-slate-400 nav-btn px-3 py-1">
            <i class="fa-solid fa-warehouse text-base"></i><span class="text-[9px] playful-font font-semibold">Склад</span>
        </button>
        <button onclick="switchTab('shop')" id="nav-btn-shop" class="flex flex-col items-center space-y-1 text-slate-400 nav-btn px-3 py-1">
            <i class="fa-solid fa-store text-base"></i><span class="text-[9px] playful-font font-semibold">Лавка</span>
        </button>
    </nav>

    <script>
        const gameState = {
            coins: 350,
            water: 10,
            maxWater: 10,
            crops: [
                { id: 0, state: 'empty', progress: 0, timeNeeded: 3 },
                { id: 1, state: 'empty', progress: 0, timeNeeded: 3 },
                { id: 2, state: 'empty', progress: 0, timeNeeded: 3 },
                { id: 3, state: 'empty', progress: 0, timeNeeded: 3 }
            ],
            animals: [
                { id: 'chicken', name: 'Курочка', icon: 'fa-feather', product: 'egg', productName: 'Яйцо', timer: 5, productionTime: 5, ready: true, count: 1 },
                { id: 'rabbit', name: 'Кролик', icon: 'fa-carrot', product: 'fur', productName: 'Шерстка', timer: 8, productionTime: 8, ready: true, count: 1 }
            ],
            inventory: { wheat: 4, egg: 2, fur: 1 },
            shopItems: [
                { id: 'buy_chicken', name: 'Купить курочку', cost: 100, type: 'animal', target: 'chicken', desc: 'Несет яйца' },
                { id: 'buy_rabbit', name: 'Купить кролика', cost: 150, type: 'animal', target: 'rabbit', desc: 'дает шерстку' }
            ]
        };

        const itemNames = {
            wheat: { name: 'Пшеница', icon: 'fa-wheat-awn', price: 10 },
            egg: { name: 'Яйцо', icon: 'fa-egg', price: 25 },
            fur: { name: 'Шерстка', icon: 'fa-socks', price: 40 }
        };

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-amber-400', 'text-slate-400'));
            document.getElementById(`nav-btn-${tabName}`).classList.replace('text-slate-400', 'text-amber-400');
            updateUI();
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'bg-emerald-600 text-white px-3 py-1.5 rounded-xl shadow text-xs font-semibold';
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        function updateUI() {
            document.getElementById('coins-display').innerText = gameState.coins;
            document.getElementById('water-display').innerText = `${gameState.water}/${gameState.maxWater}`;
            renderCrops();
            renderAnimals();
            renderPasture();
            renderInventory();
            renderShop();
        }

        function renderCrops() {
            const grid = document.getElementById('crops-grid');
            grid.innerHTML = '';
            gameState.crops.forEach(c => {
                let bg = 'bg-stone-800 border-stone-700';
                let text = '<span class="text-[10px] text-slate-400">Пусто (Сажать)</span>';
                if(c.state === 'planted') {
                    bg = 'bg-amber-950/40 border-amber-600';
                    text = `<span class="text-[10px] text-amber-200">Растет (${c.progress}с)</span>`;
                } else if(c.state === 'ready') {
                    bg = 'bg-emerald-900/60 border-emerald-500 animate-pulse';
                    text = '<span class="text-[10px] font-bold text-emerald-200">Собрать!</span>';
                }
                const div = document.createElement('div');
                div.className = `${bg} border rounded-2xl p-3 flex flex-col items-center justify-center h-20 shadow cursor-pointer active:scale-95`;
                div.onclick = () => handleCrop(c.id);
                div.innerHTML = `<i class="fa-solid fa-seedling text-emerald-400 mb-1"></i>${text}`;
                grid.appendChild(div);
            });
        }

        function handleCrop(id) {
            const c = gameState.crops.find(x => x.id === id);
            if(c.state === 'empty' && gameState.water >= 2) {
                gameState.water -= 2;
                c.state = 'planted';
                c.progress = c.timeNeeded;
                showToast('Зерно посажено!');
            } else if(c.state === 'ready') {
                c.state = 'empty';
                gameState.inventory.wheat += 2;
                showToast('+2 Пшеницы!');
            }
            updateUI();
        }

        function waterAllCrops() {
            gameState.crops.forEach(c => {
                if(c.state === 'empty' && gameState.water >= 2) {
                    gameState.water -= 2;
                    c.state = 'planted';
                    c.progress = c.timeNeeded;
                }
            });
            updateUI();
        }

        function renderAnimals() {
            const grid = document.getElementById('animals-grid');
            grid.innerHTML = '';
            gameState.animals.forEach(a => {
                const div = document.createElement('div');
                div.className = 'bg-stone-800 border border-stone-700 rounded-2xl p-3 flex items-center justify-between shadow';
                div.innerHTML = `
                    <div><h4 class="font-bold text-xs text-white">${a.name}</h4><p class="text-[10px] text-slate-400">${a.ready ? 'Готово!' : a.timer+'с'}</p></div>
                    <button onclick="collectAnimal('${a.id}')" class="px-2 py-1 rounded-xl text-xs font-bold ${a.ready ? 'bg-amber-500 text-stone-900' : 'bg-stone-700 text-stone-500'}">${a.ready ? 'Сбор' : 'Ждите'}</button>
                `;
                grid.appendChild(div);
            });
        }

        function renderPasture() {
            const container = document.getElementById('pasture-animals-container');
            container.innerHTML = '';
            gameState.animals.forEach(a => {
                const div = document.createElement('div');
                div.className = `flex flex-col items-center cursor-pointer p-2 rounded-2xl bg-amber-500/20 border border-amber-400/50 ${a.ready ? 'animate-bounce-gentle' : ''}`;
                div.onclick = () => collectAnimal(a.id);
                div.innerHTML = `
                    <i class="fa-solid ${a.icon} text-2xl text-amber-300 mb-1"></i>
                    <span class="text-[10px] font-bold text-white">${a.name} ${a.ready ? '(Собрать!)' : ''}</span>
                `;
                container.appendChild(div);
            });
        }

        function collectAnimal(id) {
            const a = gameState.animals.find(x => x.id === id);
            if(a && a.ready) {
                a.ready = false;
                a.timer = a.productionTime;
                gameState.inventory[a.product] += a.count;
                showToast(`+${a.count} ${a.productName}!`);
                updateUI();
            }
        }

        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            Object.keys(gameState.inventory).forEach(k => {
                if(!itemNames[k]) return;
                const div = document.createElement('div');
                div.className = 'bg-stone-800 border border-stone-700 rounded-2xl p-3 flex flex-col items-center shadow';
                div.innerHTML = `<i class="fa-solid ${itemNames[k].icon} text-amber-400 text-lg mb-1"></i><span class="font-bold text-xs text-white">${gameState.inventory[k]}</span><span class="text-[10px] text-slate-400">${itemNames[k].name}</span>`;
                grid.appendChild(div);
            });
        }

        function sellAllGoods() {
            let earned = 0;
            Object.keys(gameState.inventory).forEach(k => {
                if(itemNames[k]) {
                    earned += gameState.inventory[k] * itemNames[k].price;
                    gameState.inventory[k] = 0;
                }
            });
            gameState.coins += earned;
            showToast(`Продано на ${earned} монет!`);
            updateUI();
        }

        function renderShop() {
            const list = document.getElementById('shop-list');
            list.innerHTML = '';
            gameState.shopItems.forEach(i => {
                const div = document.createElement('div');
                div.className = 'bg-stone-800 border border-stone-700 rounded-2xl p-3 flex justify-between items-center';
                div.innerHTML = `<div><h4 class="font-bold text-xs text-white">${i.name}</h4><p class="text-[10px] text-amber-400">${i.cost} монет</p></div><button onclick="buy('${i.id}')" class="bg-purple-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">Купить</button>`;
                list.appendChild(div);
            });
        }

        function buy(id) {
            const item = gameState.shopItems.find(x => x.id === id);
            if(gameState.coins >= item.cost) {
                gameState.coins -= item.cost;
                const an = gameState.animals.find(x => x.id === item.target);
                if(an) an.count++;
                showToast('Куплено!');
                updateUI();
            } else {
                showToast('Мало монет!');
            }
        }

        // Таймер игры
        setInterval(() => {
            gameState.crops.forEach(c => {
                if(c.state === 'planted') {
                    c.progress--;
                    if(c.progress <= 0) c.state = 'ready';
                }
            });
            gameState.animals.forEach(a => {
                if(!a.ready) {
                    a.timer--;
                    if(a.timer <= 0) a.ready = true;
                }
            });
            if(Math.random() < 0.3 && gameState.water < gameState.maxWater) gameState.water++;
            updateUI();
        }, 1000);

        updateUI();
    </script>
</body>
</html>
